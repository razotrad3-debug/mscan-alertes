# Scan MSCAN en continu dans le cloud, alertes sur Telegram.
# L'ordinateur peut rester eteint.
#
# Un job GitHub peut durer 6 h. Plutot qu'une execution par scan — ou le
# planificateur derive de 10 a 30 min sous charge — on lance un job long qui
# scanne en boucle toutes les 10 min. Couverture quasi continue, et le bot
# repond aux commandes Telegram pendant toute la fenetre.
name: Alertes MSCAN

on:
  schedule:
    - cron: "0 */6 * * *"     # relance la fenetre toutes les 6 h
  workflow_dispatch:

concurrency:
  group: mscan-scan
  cancel-in-progress: false    # on ne coupe jamais une fenetre en cours

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # 5 h 50 : on rend la main avant la fenetre suivante
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements-bot.txt

      # coins deja alertes, caches de pools, photos de soldes : conserves d'une
      # fenetre a l'autre, sinon chaque relance re-alerterait les memes coins.
      - name: Restaurer l'etat
        uses: actions/cache/restore@v4
        with:
          path: |
            telegram_sent.json
            telegram_msgids.json
            insider_seen.json
            pool_cache.json
            holdings_cache.json
            holdings.json
            flow_snapshots
          key: mscan-etat-${{ github.run_id }}
          restore-keys: mscan-etat-

      # Les listes de wallets ne sont PAS dans le depot : elles vivent dans le
      # secret MSCAN_DATA et sont ecrites ici, sur la machine ephemere.
      - name: Restaurer les donnees privees
        env:
          MSCAN_DATA: ${{ secrets.MSCAN_DATA }}
        run: python pack_data.py unpack

      - name: Scanner en continu
        env:
          HELIUS_API_KEY:     ${{ secrets.HELIUS_API_KEY }}
          FOMOSCAN_API_KEYS:  ${{ secrets.FOMOSCAN_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_INTERVAL_SEC:  "600"
        run: python bot_server.py --minutes 340

      - name: Sauvegarder l'etat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            telegram_sent.json
            telegram_msgids.json
            insider_seen.json
            pool_cache.json
            holdings_cache.json
            holdings.json
            flow_snapshots
          key: mscan-etat-${{ github.run_id }}
